name: build

on:
  - push
  - pull_request

# Neither job writes anything back to the repository, so drop the default token down to a read of the
# checkout. Any job that needs more can raise it for itself.
permissions:
  contents: read

jobs:
  lint:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      # Run once rather than across the matrix: TargetRubyVersion in .rubocop.yml decides which cops
      # apply, so the result does not depend on the Ruby that rubocop itself runs on.
      - name: Run Rubocop
        run: bundle exec rubocop

  test:
    name: "Test: Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    # Overrides the workflow-level read-only default: the coverage entry pushes the badge to
    # the badges branch.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        ruby: [3.2, 3.3, 3.4, "4.0"]
        # Measure coverage on one MRI version only.
        include:
          - ruby: 3.4
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          # runs 'bundle install' and caches installed gems automatically
          bundler-cache: true
      - name: Ruby Version
        run: ruby --version
      # `rake test` rather than the default task, so rubocop is not repeated on every matrix entry.
      - name: Run Tests
        run: bundle exec rake test

      - name: Publish Coverage Badge
        if: ${{ matrix.coverage && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Write a shields.io endpoint file from SimpleCov's summary.
          mkdir "$RUNNER_TEMP/badges"
          ruby -rjson -e '
            percent = JSON.parse(File.read("coverage/.last_run.json")).dig("result", "line")
            color   = {90 => "brightgreen", 80 => "green", 70 => "yellow", 60 => "orange"}.find { |min, _| percent >= min }&.last || "red"
            badge   = {schemaVersion: 1, label: "coverage", message: format("%.1f%%", percent), color: color}
            File.write(ARGV[0], JSON.generate(badge))
          ' "$RUNNER_TEMP/badges/coverage.json"
          # Replace the badges branch with a single commit so that it never accumulates history.
          cd "$RUNNER_TEMP/badges"
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update coverage badge"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
