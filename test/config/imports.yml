# Fixtures for `__import__` resolution order.
# Each root is read on its own, so the invalid roots below do not affect the valid ones.
test:
  # `top` imports `mid`, which imports `base`, and both are declared after the node importing them.
  forward:
    top:
      __import__: mid
    mid:
      __import__: base
      port:       5432
    base:
      host: base.example.net
      port: 3306

  circular:
    first:
      __import__: second
    second:
      __import__: first

  self_referencing:
    node:
      __import__: node

  # Absolute imports are each resolved by a separate fetch, so these cycles are only visible
  # across the fetches rather than within a single parser.
  absolute_a:
    node:
      __import__: /test/absolute_b/node

  absolute_b:
    node:
      __import__: /test/absolute_a/node

  absolute_self:
    node:
      __import__: /test/absolute_self/node

  # A valid absolute import, to confirm the cycle check does not reject the ordinary case.
  absolute_valid:
    node:
      __import__: /test/absolute_source
      port:       5432

  absolute_source:
    host: source.example.net
    port: 3306
