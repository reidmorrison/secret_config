# Shared look and feel comes from reidmorrison/rm-docs-theme, which supplies
# the layout, the sidebar, the stylesheet and the syntax sheet. This repo keeps
# only its own content: the markdown pages and docs/images.
#
# Pinned to a major tag. v1 moves as the theme is fixed, so this site picks up
# changes on its next build; breaking changes go to v2 and are opted into here.
remote_theme: reidmorrison/rm-docs-theme@v1

markdown: kramdown
kramdown:
  toc_levels: "2..3"

plugins:
  # GitHub Pages enables this on its own, but a local `bundle exec jekyll
  # build` does not: Jekyll only auto-requires gems in the :jekyll_plugins
  # bundler group, so without it the theme is silently skipped and every page
  # reports "Layout 'default' does not exist".
  - jekyll-remote-theme

# Read by the theme's masthead, head and footer. The theme ships no defaults:
# Jekyll exposes only _layouts, _includes, _sass and assets from a theme, so
# every site declares this block in full.
project:
  name: Secret Config
  tagline: One image. Every environment.
  github: reidmorrison/secret_config
  gem: secret_config
  license: Apache 2.0 License

  # Carried over from the layout this replaces, which hard-coded one title and
  # one description for all ten pages. `seo_title` is the home page's <title>;
  # every other page builds its own from front matter.
  seo_title: "Secret Config: Centralized Configuration and Secrets Management for Ruby and Rails applications."
  description: >-
    Secret Config is centralized configuration and secrets management for Ruby
    and Rails applications. Stores settings in AWS SSM Parameter Store or a
    local file, with environment variable overrides.

# The sidebar, replacing the row of ten header buttons. Group names match the
# other doc sites so the family reads the same way; order within a group is
# reading order, not alphabetical.
nav:
  - group: Start here
    items:
      - { page: index.html,         label: Overview }
      - { page: guide.html,         label: Getting Started }
      - { page: api.html,           label: Guide }

  - group: Configuration
    items:
      - { page: config.html,        label: Configuration }
      - { page: providers.html,     label: Providers }
      - { page: interpolation.html, label: Interpolation }

  - group: Integration
    items:
      - { page: rails.html,         label: Rails }
      - { page: testing.html,       label: Testing }

  - group: Reference
    items:
      - { page: cli.html,           label: Command Line }
      - { page: upgrading.html,     label: Upgrading }

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
